name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - v4
  # Fired by the Airtable automation "Verified" when a submission is approved.
  # Airtable is the editorial desk: approving a record is what publishes it.
  repository_dispatch:
    types: [airtable-verified]
  # Manual publish from the Actions tab, for when you want to force a rebuild.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Dependencies
        run: npm ci
      - name: Sync submissions from Airtable
        run: node scripts/sync-airtable.mjs
        env:
          AIRTABLE_STITCHED_PT: ${{ secrets.AIRTABLE_STITCHED_PT }}
      - name: Build Quartz
        run: npx quartz build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
