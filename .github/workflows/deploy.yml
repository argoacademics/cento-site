name: Publish CENTO (trigger Vercel)

# CENTO is built and served by VERCEL, not GitHub Pages. A push to v4 is picked
# up by Vercel's own git integration, so this workflow exists for ONE reason:
# to let Airtable's "Verified" automation trigger a publish, by forwarding its
# repository_dispatch to a Vercel Deploy Hook.
#
# The 30-minute polling cron that used to live here is GONE. It existed only
# because Actions minutes are free on public repos and Airtable's script action
# is paid-only; with a Deploy Hook, approval publishes immediately instead of
# up to half an hour later.

on:
  # Fired by the Airtable automation "Verified" when a submission is approved.
  # Airtable is the editorial desk: approving a record is what publishes it.
  repository_dispatch:
    types: [airtable-verified]
  # Manual publish, for forcing a rebuild without an approval.
  workflow_dispatch:

permissions:
  contents: none

jobs:
  trigger:
    runs-on: ubuntu-22.04
    steps:
      - name: Trigger the Vercel deploy hook
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "VERCEL_DEPLOY_HOOK_URL is not set — cannot publish." >&2
            echo "Create a Deploy Hook on the Vercel project (Settings →" >&2
            echo "Git → Deploy Hooks, branch v4) and add it as a repo secret." >&2
            exit 1
          fi
          # The hook URL is itself the credential, so never echo it.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$HOOK")
          echo "Deploy hook responded $code"
          case "$code" in
            2*) echo "Publish triggered." ;;
            *)  echo "Deploy hook failed." >&2; exit 1 ;;
          esac
